name: motorcycle-last-mile-routing
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: senior_db
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${DB_DATA_PATH}:/var/lib/postgresql/data
    networks:
      - osm_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  osm2pgsql:
    image: iboates/osm2pgsql:latest
    container_name: osm_importer
    volumes:
      - ./data:/data
      - ./infra/osrm:/osrm
    depends_on:
      - db
    networks:
      - osm_net
    env_file: .env
    environment:
      - PGHOST=db
      - PGPORT=${POSTGRES_PORT}
      - PGDATABASE=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    entrypoint: ["osm2pgsql"]

  osrm:
    image: motorcycle-osrm:26.6.5-table-nonnegative-trial1
    build:
      context: ./infra/osrm
      dockerfile: Dockerfile.patched
    container_name: osrm_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./infra/osrm/graph:/data
    networks:
      - osm_net
    command: osrm-routed --algorithm mld --max-table-size 2000 /data/thailand-latest.osrm

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: routing_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - OSRM_URL=http://osrm:5000
      - ENGINE_CONCURRENCY=${ENGINE_CONCURRENCY:-}
    ports:
      - "4000:4000"
    volumes:
      - ./results:/app/results:ro
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started
    networks:
      - osm_net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: routing_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - osm_net

networks:
  osm_net:
    driver: bridge