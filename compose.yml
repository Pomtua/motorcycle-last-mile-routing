name: senior-project-create-database
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: senior_db
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${DB_DATA_PATH}:/var/lib/postgresql/data
    networks:
      - osm_net

  osm2pgsql:
    image: iboates/osm2pgsql:latest
    container_name: osm_importer
    volumes:
      - .:/data  
    depends_on:
      - db
    networks:
      - osm_net
    entrypoint: ["osm2pgsql"]
  
  osrm:
    image: osrm/osrm-backend
    container_name: osrm_server
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    command: osrm-routed --algorithm mld /data/thailand-latest.osrm

networks:
  osm_net:
    driver: bridge